<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
        }

        .chat-container {
            width: 400px;
            margin: 50px auto;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            margin: 0;
            padding: 15px;
            background: #007bff;
            color: white;
            text-align: center;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            background: #e9ecef;
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <h2>Simple Chat</h2>

    <div id="messages"></div>

    <div class="input-area">
        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
        />

        <button onclick="sendMessage()">
            Send
        </button>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
    const socket = io();

    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    // Send message
    function sendMessage() {
        const message = messageInput.value.trim();

        if (message === "") {
            return;
        }

        socket.emit("chat message", message);

        messageInput.value = "";
        messageInput.focus();
    }

    // Receive message
    socket.on("chat message", (message) => {
        const div = document.createElement("div");

        div.className = "message";
        div.textContent = message;

        messages.appendChild(div);

        messages.scrollTop = messages.scrollHeight;
    });

    // Send with Enter key
    messageInput.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>

</body>
</html>
